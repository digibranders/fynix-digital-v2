name: CI + Deploy (droplet)

# The droplet only ever runs `main`. On a push to main the CI job (lint,
# typecheck, build) must pass first; only then does the deploy job ship main to
# the droplet at api.fynix.digital. Pull requests into main run CI as a gate but
# never deploy. The marketing site is deployed separately by Vercel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize deploys; cancel only superseded PR checks, never a main deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Unit tests
        # Guards the GST engine and invoice series: a wrong tax split or a
        # duplicated invoice number is a compliance defect, not just a bug.
        run: npm test
      - name: Build
        # Validate a production build compiles. The droplet is same-origin, and
        # Sentry source-map upload is skipped here (not needed to gate the build).
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
          SENTRY_AUTH_TOKEN: ""
        run: npm run build

  deploy:
    name: Deploy main to droplet
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate server .env from secrets
        run: |
          umask 077
          cat > api.env <<EOF
          # Generated by GitHub Actions on $(date -u +%Y-%m-%dT%H:%M:%SZ). DO NOT COMMIT.
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          FORM_SECRET=${{ secrets.FORM_SECRET || secrets.PAVEL_FORM_SECRET }}
          # The droplet no longer serves /admin, so these only matter if it ever
          # has to again. Kept in sync rather than dropped.
          ADMIN_EMAIL=${{ vars.ADMIN_EMAIL || vars.PAVEL_ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || secrets.PAVEL_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET=${{ secrets.ADMIN_SESSION_SECRET || secrets.PAVEL_ADMIN_SESSION_SECRET }}
          PAVEL_CRON_SECRET=${{ secrets.PAVEL_CRON_SECRET }}
          # Zoom Server-to-Server OAuth: registers paid buyers into the
          # webinar and reads attendance. The webhook secret token verifies
          # event notifications Zoom sends us.
          ZOOM_ACCOUNT_ID=${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_WEBHOOK_SECRET_TOKEN=${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
          # Admin console link. The droplet backs the console but must not serve
          # it, so the UI is disabled here and only /api/admin/data/* is exposed,
          # guarded by the shared secret the console sends. ADMIN_API_ORIGIN is
          # deliberately absent: this host reads its own database directly.
          ADMIN_PROXY_SECRET=${{ secrets.ADMIN_PROXY_SECRET }}
          ADMIN_UI_DISABLED=${{ vars.ADMIN_UI_DISABLED }}
          NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL=
          ALLOWED_ORIGIN=${{ vars.ALLOWED_ORIGIN }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
          EOF

      - name: Upload .env to droplet
        run: |
          scp -i ~/.ssh/id_deploy api.env \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/opt/fynix/.env.incoming"
          rm -f api.env

      - name: Pull main, build, migrate, restart
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd /opt/fynix

          # Activate the freshly generated env (atomic replace).
          mv -f .env.incoming .env
          chmod 600 .env

          # The droplet only ever runs main.
          git fetch origin main --prune --quiet
          git checkout main
          git reset --hard origin/main

          # Install + build.
          #
          # The heap cap must stay BELOW the droplet's physical memory (961MB).
          # It was 1536MB, which let V8 grow past what the box has: instead of
          # collecting garbage it thrashed into swap until the machine stopped
          # answering and the deploy died mid-build with a broken pipe. A cap
          # under physical RAM makes V8 collect instead of drown.
          #
          # Note this build is NOT free of consequence if it fails: `next build`
          # writes into .next in place, so a failed build leaves no usable build
          # on disk. The running process survives on what it already loaded, but
          # the next restart — a crash, a reboot, a deploy — has nothing to
          # start from. Treat a red deploy as something to fix now, not later.
          npm ci --no-audit --no-fund
          set -a; . ./.env; set +a
          NODE_OPTIONS=--max-old-space-size=768 npm run build

          # Apply pending migrations, then the idempotent referral seed.
          npm run db:migrate
          npm run db:seed

          # Swap the new build in.
          sudo /usr/bin/systemctl restart fynix-api

          # Fail the deploy if the API doesn't come back healthy. /api/health
          # returns 200 only when the process is up AND Postgres answers.
          sleep 4
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          echo "post-deploy health: HTTP $code"
          test "$code" = "200"
          DEPLOY
