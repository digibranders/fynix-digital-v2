name: Deploy API to droplet

# Deploys the Next.js API + admin to the DigitalOcean droplet behind
# api.fynix.digital. The marketing site is deployed separately by Vercel.
#
# Flow: generate the server .env from GitHub secrets/variables on the runner,
# copy it to the droplet, then over SSH pull the target ref, build, migrate, and
# restart the systemd service. The old build keeps serving until the new build
# succeeds, so a failed build never takes the API down.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        default: "main"

# Never let two deploys run at once; queue them instead of cancelling.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate server .env from secrets
        run: |
          umask 077
          cat > api.env <<EOF
          # Generated by GitHub Actions on $(date -u +%Y-%m-%dT%H:%M:%SZ). DO NOT COMMIT.
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          PAVEL_FORM_SECRET=${{ secrets.PAVEL_FORM_SECRET }}
          PAVEL_ADMIN_EMAIL=${{ vars.PAVEL_ADMIN_EMAIL }}
          PAVEL_ADMIN_PASSWORD=${{ secrets.PAVEL_ADMIN_PASSWORD }}
          PAVEL_ADMIN_SESSION_SECRET=${{ secrets.PAVEL_ADMIN_SESSION_SECRET }}
          PAVEL_CRON_SECRET=${{ secrets.PAVEL_CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL=
          ALLOWED_ORIGIN=${{ vars.ALLOWED_ORIGIN }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
          EOF

      - name: Upload .env to droplet
        run: |
          scp -i ~/.ssh/id_deploy api.env \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/opt/fynix/.env.incoming"
          rm -f api.env

      - name: Pull, build, migrate, restart
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "DEPLOY_REF='${DEPLOY_REF}' bash -s" <<'DEPLOY'
          set -euo pipefail
          cd /opt/fynix

          # Activate the freshly generated env (atomic replace).
          mv -f .env.incoming .env
          chmod 600 .env

          # Sync code to the requested ref.
          git fetch --all --prune --quiet
          git checkout "$DEPLOY_REF"
          git reset --hard "origin/$DEPLOY_REF"

          # Install + build. The running service keeps serving the old build
          # until this succeeds, so a broken build never causes an outage.
          npm ci --no-audit --no-fund
          set -a; . ./.env; set +a
          NODE_OPTIONS=--max-old-space-size=1536 npm run build

          # Apply pending migrations, then the idempotent referral seed.
          npm run db:migrate
          npm run db:seed

          # Swap the new build in.
          sudo /usr/bin/systemctl restart fynix-api

          # Fail the deploy if the API doesn't come back healthy.
          sleep 4
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/pavel/form-token)
          echo "post-deploy health: HTTP $code"
          test "$code" = "200"
          DEPLOY
