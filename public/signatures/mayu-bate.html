<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fynix Email Signature — Mayur Bate</title>
    <!--
      Notes for use:
      - Keep everything inline for email client compatibility.
      - Copy only the table with id `fynix-signature` into your email client.
      - All images are hosted on fynix.digital, do not remove or replace with a local path.
    -->
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      id="fynix-signature"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 560px; max-width: 560px; border-collapse: collapse"
    >
      <tr>
        <!-- Left: Logo -->
        <td
          valign="middle"
          style="
            width: 140px;
            padding: 0 18px 0 0;
            border-right: 1px solid #f0f0f0;
          "
        >
          <img
            src="https://fynix.digital/email/logo.png"
            width="110"
            alt="Fynix"
            style="
              display: block;
              border: 0;
              outline: none;
              text-decoration: none;
              width: 110px;
              max-width: 110px;
              margin-left: auto;
              margin-right: auto;
              height: auto;
            "
          />
        </td>

        <!-- Right: Details -->
        <td valign="top" style="padding: 0">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              border-collapse: collapse;
              background: #ffffff;
              border-radius: 10px;
            "
          >
            <tr>
              <td style="padding: 18px 22px 14px 22px">
                <div
                  style="
                    font-size: 24px;
                    line-height: 22px;
                    color: #2c2f36;
                    font-weight: 700;
                  "
                >
                  Mayur Bate
                </div>
                <div
                  style="
                    font-size: 15px;
                    line-height: 20px;
                    color: #2c2f36;
                    font-weight: 600;
                    padding-top: 4px;
                    text-transform: uppercase;
                  "
                >
                  UI/UX Designer
                </div>

                <div style="height: 10px; line-height: 10px; font-size: 10px">
                  &nbsp;
                </div>

                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="border-collapse: collapse"
                >
                  <tr>
                    <td
                      style="
                        font-size: 14px;
                        line-height: 20px;
                        color: #2c2f36;
                        white-space: nowrap;
                      "
                    >
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="border-collapse: collapse"
                      >
                        <tr>
                          <td valign="middle" style="padding-right: 8px">
                            <img
                              src="https://fynix.digital/signatures/assets/call.png"
                              width="13"
                              alt=""
                              style="display: block"
                            />
                          </td>
                          <td valign="middle">
                            <a
                              href="tel:+917030574583"
                              style="color: #2c2f36; text-decoration: none"
                            >
                              +91-70305 74583
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="font-size: 14px; line-height: 20px; color: #2c2f36"
                    >
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="border-collapse: collapse"
                      >
                        <tr>
                          <td valign="middle" style="padding-right: 8px">
                            <img
                              src="https://fynix.digital/signatures/assets/email.png"
                              width="13"
                              alt=""
                              style="display: block"
                            />
                          </td>
                          <td valign="middle" style="padding-right: 8px">
                            <a
                              href="mailto:mayur@fynix.digital"
                              style="color: #2c2f36; text-decoration: none"
                            >
                              mayur@fynix.digital
                            </a>
                          </td>
                          <td
                            valign="middle"
                            style="color: #9aa0a6; padding-right: 8px"
                          >
                            |
                          </td>
                          <td valign="middle" style="padding-right: 8px">
                            <img
                              src="https://fynix.digital/signatures/assets/link.png"
                              width="13"
                              alt=""
                              style="display: block"
                            />
                          </td>
                          <td valign="middle">
                            <a
                              href="https://www.fynix.digital"
                              style="color: #2c2f36; text-decoration: none"
                            >
                              www.fynix.digital
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>

                <div style="height: 12px; line-height: 12px; font-size: 12px">
                  &nbsp;
                </div>

                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="border-collapse: collapse"
                >
                  <tr>
                    <td style="padding-right: 8px">
                      <a
                        href="https://in.linkedin.com/company/fynixofficial"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="display: inline-block; text-decoration: none"
                      >
                        <img
                          src="https://fynix.digital/signatures/assets/linkedin.png"
                          width="28"
                          height="28"
                          alt="LinkedIn"
                          style="display: block"
                        />
                      </a>
                    </td>
                    <td>
                      <a
                        href="https://www.instagram.com/fynix_digital/"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="display: inline-block; text-decoration: none"
                      >
                        <img
                          src="https://fynix.digital/signatures/assets/instagram.png"
                          width="28"
                          height="28"
                          alt="Instagram"
                          style="display: block"
                        />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
